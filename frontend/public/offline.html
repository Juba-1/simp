<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0369a1" />
    <title>SIMP — Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #0c4a6e 0%, #0369a1 50%, #0284c7 100%);
        color: #f0f9ff;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 1rem;
        padding: 2rem;
      }
      h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
      p { opacity: 0.9; line-height: 1.6; margin-bottom: 1.5rem; }
      button {
        background: #fff;
        color: #0369a1;
        border: none;
        border-radius: 0.5rem;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover { background: #e0f2fe; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>SIMP — غير متصل</h1>
      <p>
        You are offline. Field forms saved on this device will sync when connectivity returns.
        <br /><br />
        أنت غير متصل. النماذج المحفوظة على هذا الجهاز ستُزامَن عند عودة الاتصال.
      </p>
      <button type="button" onclick="location.reload()">Retry / إعادة المحاولة</button>
    </div>
  </body>
</html>
